name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      # drizzle-kit không đọc drizzle/manual/ — nó chỉ chạy file có đăng ký trong
      # meta/_journal.json. Sửa manual/ mà quên `npm run db:sync` sẽ khiến RLS và
      # audit guard không bao giờ được áp lên database, mà không có lỗi nào báo.
      - name: Check manual migrations are in sync
        run: npm run db:sync:check

      - name: Build
        run: npm run build

      - name: Smoke test the built server
        env:
          NODE_ENV: production
          PORT: 8080
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          kill $SERVER_PID || true
          exit 1

      - name: Build Docker image
        run: docker build -t hnxcis-backend:ci .
