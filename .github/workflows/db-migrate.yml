name: Migrate Cloud SQL (Drizzle)

# Migrations are deliberately NOT part of the deploy workflow: schema changes are
# applied on purpose, by a human, through the Cloud SQL Auth Proxy.
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Drizzle command to run'
        required: true
        default: 'migrate'
        type: choice
        options:
          - migrate
          - push

permissions:
  contents: read
  id-token: write

concurrency:
  group: db-migrate
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  SQL_DB_NAME: ${{ vars.SQL_DB_NAME || 'hnxcis' }}
  SQL_ADMIN_USER: ${{ vars.SQL_ADMIN_USER || 'postgres' }}
  DB_ADMIN_PASSWORD_SECRET: ${{ vars.DB_ADMIN_PASSWORD_SECRET || 'hnxcis-db-admin-password' }}
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Authenticate to Google Cloud (service account key)
        if: env.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read DB admin password from Secret Manager
        id: secret
        run: |
          set -euo pipefail
          PASSWORD="$(gcloud secrets versions access latest --secret="${DB_ADMIN_PASSWORD_SECRET}")"
          echo "::add-mask::${PASSWORD}"
          echo "password=${PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Start Cloud SQL Auth Proxy
        run: |
          set -euo pipefail
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${CLOUD_SQL_INSTANCE}" > proxy.log 2>&1 &
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5432; then
              echo "Cloud SQL Auth Proxy is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Cloud SQL Auth Proxy did not start"
          cat proxy.log
          exit 1

      - name: Run drizzle-kit ${{ github.event.inputs.command }}
        env:
          SQL_HOST: 127.0.0.1
          SQL_PORT: '5432'
          SQL_DB_NAME: ${{ env.SQL_DB_NAME }}
          SQL_ADMIN_USER: ${{ env.SQL_ADMIN_USER }}
          SQL_ADMIN_PASSWORD: ${{ steps.secret.outputs.password }}
          SQL_SSL: 'false'
        run: npm run db:${{ github.event.inputs.command }}

      - name: Summary
        run: |
          {
            echo "### Cloud SQL migration finished"
            echo ""
            echo "- Command: \`drizzle-kit ${{ github.event.inputs.command }}\`"
            echo "- Instance: \`${CLOUD_SQL_INSTANCE}\`"
            echo "- Database: \`${SQL_DB_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
