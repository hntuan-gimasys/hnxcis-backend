name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # db-migrate.yml is no longer ignored here: this workflow now calls it, so a
      # change to it changes what deploy does and should be exercised by a deploy.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'

# Required for Workload Identity Federation (keyless auth to GCP).
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  # google-github-actions/auth exports CLOUDSDK_CORE_PROJECT from the credentials,
  # which outranks `gcloud config set project`. Pinning it here (workflow env wins
  # over anything written to GITHUB_ENV) keeps every step on the intended project.
  CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'hnxcis' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'hnxcis-backend' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SA }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  SQL_DB_NAME: ${{ vars.SQL_DB_NAME || 'hnxcis' }}
  SQL_USER: ${{ vars.SQL_USER || 'hnxcis_app' }}
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
  # Firebase project có thể khác project chạy Cloud Run.
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || vars.GCP_PROJECT_ID }}
  AUTH_REQUIRED: ${{ vars.AUTH_REQUIRED || 'false' }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
  # The Cloud SQL password travels as a plain env var instead of a Secret Manager
  # mount: the runtime service account holds roles/editor, which grants
  # secretmanager.versions.get but NOT secretmanager.versions.access, and no
  # principal available to this project can grant roles/secretmanager.secretAccessor.
  # Trade-off accepted deliberately: the value is then readable in the Cloud Run
  # service config by anyone holding run.viewer on the project.
  SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
  GEMINI_API_KEY_SECRET: ${{ vars.GEMINI_API_KEY_SECRET || 'hnxcis-gemini-api-key' }}
  # Defaults to 'false' for the same reason as the frontend repo: the bof-intern
  # org enforces Domain Restricted Sharing (constraints/iam.allowedPolicyMemberDomains),
  # which blocks granting allUsers access, so `--allow-unauthenticated` cannot
  # actually take effect. Flip to 'true' (repository variable) once that policy
  # has an exception for this project/service.
  #
  # Note this is a HARDER blocker for the backend than for the frontend: the SPA
  # calls this API straight from the browser, and a browser cannot present the
  # ID token that roles/run.invoker requires. So while this stays 'false' the
  # app does not work end-to-end for real users, no matter what the frontend does.
  ALLOW_UNAUTHENTICATED: ${{ vars.ALLOW_UNAUTHENTICATED || 'false' }}
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  # Schema first, container second. The reverse order leaves a window where the
  # new code is live against the old schema and queries columns that do not exist
  # yet. `drizzle-kit migrate` is idempotent — with nothing pending this job costs
  # seconds — so it is cheap to run on every deploy and expensive to forget once.
  #
  # Skipped when CLOUD_SQL_INSTANCE is unset, which is the bootstrap case: the
  # very first revision of a fresh project is deployed before Cloud SQL is wired
  # up (see the comment on getDb() in src/db/index.ts). Without this guard that
  # first deploy could never succeed.
  #
  # The approval gate lives in db-migrate.yml's `production` environment, not
  # here: add required reviewers under Settings > Environments and every schema
  # change waits for a human, while the deploy job below stays unattended.
  migrate:
    name: Database
    if: vars.CLOUD_SQL_INSTANCE != ''
    uses: ./.github/workflows/db-migrate.yml
    with:
      command: migrate
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    needs: migrate
    # `needs` alone would cancel this job when migrate is skipped, so accept both
    # success and skipped — but never a failure, which must block the deploy.
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          missing=""
          if [ -z "${PROJECT_ID:-}" ]; then
            missing="$missing GCP_PROJECT_ID(vars)"
          fi
          if [ -z "${WIF_PROVIDER:-}" ] && [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER-or-GCP_SA_KEY(secrets)"
          fi
          if [ -z "${SQL_PASSWORD:-}" ]; then
            missing="$missing SQL_PASSWORD(secrets)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required configuration:$missing"
            exit 1
          fi

          # SQL_PASSWORD rides inside a '^##^'-delimited --set-env-vars list, so a
          # literal '##' in the value would split it into bogus entries.
          case "${SQL_PASSWORD:-}" in
            *'##'*)
              echo "::error::SQL_PASSWORD contains '##', the --set-env-vars delimiter. Rotate it to a value without that sequence."
              exit 1
              ;;
          esac

      # --- Authenticate to Google Cloud -------------------------------------
      # Preferred: Workload Identity Federation (no long-lived keys).
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
          project_id: ${{ env.PROJECT_ID }}

      # Fallback: service-account JSON key stored in the GCP_SA_KEY secret.
      - name: Authenticate to Google Cloud (service account key)
        if: env.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Fails here with an actionable message instead of dying mid-deploy after a
      # build+push against the wrong project.
      - name: Preflight - project and API check
        run: |
          set -euo pipefail

          ACTIVE="$(gcloud config get-value account 2>/dev/null || true)"
          RESOLVED="$(gcloud config get-value project 2>/dev/null || true)"
          echo "Authenticated as : ${ACTIVE}"
          echo "Intended project : ${PROJECT_ID}"
          echo "Resolved project : ${RESOLVED}"

          if [ "${RESOLVED}" != "${PROJECT_ID}" ]; then
            echo "::error::gcloud resolved project '${RESOLVED}' instead of '${PROJECT_ID}'."
            exit 1
          fi

          if ! gcloud projects describe "${PROJECT_ID}" --format='value(projectId)' >/dev/null 2>&1; then
            echo "::error::Project '${PROJECT_ID}' does not exist, or ${ACTIVE} lacks access to it. GCP_PROJECT_ID must be the project ID (globally unique), not the display name."
            exit 1
          fi

          # serviceusage.services.list may be denied for a least-privilege deployer;
          # treat an unreadable or empty list as "cannot verify" rather than "all
          # disabled" -- a false positive here blocks a deploy that would succeed.
          # `tr` flattens the line-separated output (CR included, so a Windows-built
          # gcloud works too) into the space-delimited form the glob below matches;
          # pipefail still surfaces a gcloud failure.
          ENABLED=""
          if ! ENABLED="$(gcloud services list --enabled --project "${PROJECT_ID}" --format='value(config.name)' 2>/dev/null | tr '\r\n' '  ')"; then
            echo "::warning::Cannot list enabled APIs on ${PROJECT_ID} (missing serviceusage.services.list); skipping API check."
          elif [ -z "${ENABLED// /}" ]; then
            echo "::warning::Enabled-API list came back empty for ${PROJECT_ID}; skipping API check."
          else
            missing=""
            for api in run.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com; do
              case " ${ENABLED} " in
                *" ${api} "*) ;;
                *) missing="${missing} ${api}" ;;
              esac
            done
            if [ -n "${missing}" ]; then
              echo "::error::Disabled API(s) on ${PROJECT_ID}:${missing} -- run: gcloud services enable${missing} --project=${PROJECT_ID}"
              exit 1
            fi
            echo "Required APIs   : enabled"
          fi

          # GEMINI_API_KEY is optional in the app (src/config/env.ts), so a missing
          # secret downgrades the feature instead of failing the deploy. Checking it
          # here matters because Cloud Run reports a nonexistent secret as
          # "Permission denied" -- missing and unreadable look identical at deploy
          # time. Note this only needs secrets.get (covered by roles/editor); the
          # revision itself still needs versions.access to mount it.
          if gcloud secrets describe "${GEMINI_API_KEY_SECRET}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            echo "GEMINI_SECRET_PRESENT=true" >> "$GITHUB_ENV"
            echo "Gemini API key  : ${GEMINI_API_KEY_SECRET} (mounted)"
          else
            echo "GEMINI_SECRET_PRESENT=false" >> "$GITHUB_ENV"
            echo "Gemini API key  : not configured (Gemini-backed routes disabled)"
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet --project "${PROJECT_ID}"

      - name: Compute image tags
        id: image
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}"
          echo "sha_tag=${BASE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${{ steps.image.outputs.sha_tag }}" \
            -t "${{ steps.image.outputs.latest_tag }}" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.latest_tag }}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail

          # '^##^' sets a custom delimiter so values may contain commas
          # (e.g. a multi-origin CORS_ORIGINS list).
          ENV_VARS="^##^NODE_ENV=production"
          ENV_VARS="${ENV_VARS}##SQL_DB_NAME=${SQL_DB_NAME}"
          ENV_VARS="${ENV_VARS}##SQL_USER=${SQL_USER}"
          ENV_VARS="${ENV_VARS}##SQL_PASSWORD=${SQL_PASSWORD}"
          ENV_VARS="${ENV_VARS}##FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
          ENV_VARS="${ENV_VARS}##AUTH_REQUIRED=${AUTH_REQUIRED}"
          ENV_VARS="${ENV_VARS}##GEMINI_MODEL=${GEMINI_MODEL}"
          if [ -n "${CORS_ORIGINS:-}" ]; then
            ENV_VARS="${ENV_VARS}##CORS_ORIGINS=${CORS_ORIGINS}"
          fi
          if [ -n "${CLOUD_SQL_INSTANCE:-}" ]; then
            ENV_VARS="${ENV_VARS}##INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE}"
          fi

          # Preflight sets GEMINI_SECRET_PRESENT; mounting a secret that does not
          # exist fails the whole revision, so only mount what is actually there.
          SECRETS=""
          if [ "${GEMINI_SECRET_PRESENT:-false}" = "true" ]; then
            SECRETS="GEMINI_API_KEY=${GEMINI_API_KEY_SECRET}:latest"
          fi

          ARGS=(
            "${SERVICE_NAME}"
            --project "${PROJECT_ID}"
            --image "${{ steps.image.outputs.sha_tag }}"
            --region "${REGION}"
            --platform managed
            --port 8080
            --cpu 1
            --memory 512Mi
            --timeout 300
            --min-instances "${{ vars.MIN_INSTANCES || '0' }}"
            --max-instances "${{ vars.MAX_INSTANCES || '10' }}"
            --set-env-vars "${ENV_VARS}"
            --quiet
          )

          # An empty --set-secrets is rejected. When there is nothing to mount, clear
          # instead -- otherwise a secret mounted by an earlier deploy survives and
          # keeps failing the revision. Only meaningful on an existing service, so
          # skip the flag entirely when creating one.
          if [ -n "${SECRETS}" ]; then
            ARGS+=(--set-secrets "${SECRETS}")
          elif gcloud run services describe "${SERVICE_NAME}" \
              --project "${PROJECT_ID}" --region "${REGION}" >/dev/null 2>&1; then
            ARGS+=(--clear-secrets)
          fi

          # Mounts the Cloud SQL Unix socket at /cloudsql/<instance>.
          if [ -n "${CLOUD_SQL_INSTANCE:-}" ]; then
            ARGS+=(--add-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
          fi
          if [ -n "${RUNTIME_SERVICE_ACCOUNT:-}" ]; then
            ARGS+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi

          if [ "${ALLOW_UNAUTHENTICATED}" = "true" ]; then
            ARGS+=(--allow-unauthenticated)
          else
            ARGS+=(--no-allow-unauthenticated)
          fi

          gcloud run deploy "${ARGS[@]}"

          # The deployer SA can create/update revisions but does NOT hold
          # run.services.setIamPolicy, so this workflow cannot manage IAM bindings
          # on the service. `--allow-unauthenticated` above is gcloud's own
          # best-effort attempt and only warns on failure. Making the service
          # actually reachable needs a project/org admin to run ONE-TIME:
          #   gcloud run services add-iam-policy-binding "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --member=allUsers --role=roles/run.invoker
          #   gcloud run services add-iam-policy-binding "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --member="serviceAccount:<deployer-sa-email>" --role=roles/run.invoker
          # (the former needs a Domain Restricted Sharing exception in this org;
          #  the latter just needs an admin with run.services.setIamPolicy.)
          gcloud run services get-iam-policy "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" || true

          URL="$(gcloud run services describe "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Verify health endpoint
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"

          # When the service requires authentication (ALLOW_UNAUTHENTICATED=false),
          # anonymous requests never reach the container — Google's edge returns a
          # generic 404 instead. Try an identity token scoped to this service's URL
          # in case an admin separately granted this CI identity roles/run.invoker,
          # but treat the HTTP check as best-effort rather than a hard gate:
          # `gcloud run deploy` already blocked until the revision was Ready and
          # serving 100% of traffic, which is the real confirmation the container
          # started. A remaining 403/404 means this identity isn't authorized to
          # call the service — not that the deploy is broken.
          REQUIRE_HTTP_CHECK=true
          AUTH_HEADER=()
          if [ "${ALLOW_UNAUTHENTICATED}" != "true" ]; then
            REQUIRE_HTTP_CHECK=false
            ID_TOKEN="$(gcloud auth print-identity-token --audiences="${URL}" 2>/dev/null || echo "")"
            if [ -n "${ID_TOKEN}" ]; then
              AUTH_HEADER=(-H "Authorization: Bearer ${ID_TOKEN}")
            fi
          fi

          # A brand-new Cloud Run service gets a freshly-minted *.run.app hostname;
          # Google's edge routing/TLS for it can take minutes to propagate globally
          # even after the revision reports Ready, and requests in that window come
          # back 404. Subsequent deploys reuse the hostname and are ready at once.
          # In the best-effort branch there is no propagation delay worth waiting
          # out — without an invoker grant every attempt fails identically — so use
          # a short budget there instead of the full 5 minutes.
          if [ "${REQUIRE_HTTP_CHECK}" = "true" ]; then
            ATTEMPTS=30
            SLEEP_SECONDS=10
          else
            ATTEMPTS=3
            SLEEP_SECONDS=5
          fi

          for i in $(seq 1 "${ATTEMPTS}"); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${AUTH_HEADER[@]}" "${URL}/api/health" || echo "000")"
            if [ "${code}" = "200" ]; then
              echo "Healthy after ${i} attempt(s)."
              curl -sS "${AUTH_HEADER[@]}" "${URL}/api/health" || true
              echo ""
              exit 0
            fi
            echo "Attempt ${i}/${ATTEMPTS}: /api/health=${code}, retrying in ${SLEEP_SECONDS}s..."
            sleep "${SLEEP_SECONDS}"
          done

          echo "--- Last response from ${URL}/api/health ---"
          curl -sS -i "${AUTH_HEADER[@]}" "${URL}/api/health" || true

          if [ "${REQUIRE_HTTP_CHECK}" = "true" ]; then
            echo "::error::Health check failed for ${URL}/api/health after $((ATTEMPTS * SLEEP_SECONDS))s"
            exit 1
          fi

          echo "::warning::Could not confirm ${URL}/api/health over HTTP — this CI identity likely isn't granted roles/run.invoker on ${SERVICE_NAME} (ALLOW_UNAUTHENTICATED=false and this workflow cannot self-grant that binding). Treating the earlier 'gcloud run deploy' success (revision Ready, serving 100% traffic) as the health signal instead."

      - name: Summary
        run: |
          {
            echo "### Backend deployed :rocket:"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Service | \`${SERVICE_NAME}\` |"
            echo "| Region | \`${REGION}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Image | \`${{ steps.image.outputs.sha_tag }}\` |"
            echo "| Cloud SQL | \`${CLOUD_SQL_INSTANCE:-not configured}\` |"
            echo "| SQL user | \`${SQL_USER}\`$( [ "${SQL_USER}" = "postgres" ] && echo ' — **RLS IS BYPASSED: superusers ignore FORCE ROW LEVEL SECURITY**' ) |"
            echo "| Public access | \`${ALLOW_UNAUTHENTICATED}\`$( [ "${ALLOW_UNAUTHENTICATED}" != "true" ] && echo ' — **requires auth; the browser cannot call this API, so the app does not work end-to-end yet**' ) |"
          } >> "$GITHUB_STEP_SUMMARY"
